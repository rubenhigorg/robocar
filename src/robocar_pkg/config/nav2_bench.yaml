# ============================================================================
# Nav2 — configuración mínima para el BANCO (sim puro) del robocar.
#
# Robot Ackermann: L=0.175 m, radio de giro mínimo R_min=0.93 m.
# Frames: global=map, odometría=odom, robot=base_link (árbol TF ya montado).
# Fuentes del banco: /map (sim_map_grid), /scan (sim_sensors), /odometry/filtered
#                    (sim_motion). NO usamos amcl ni map_server (los aporta el banco).
# Controlador: Regulated Pure Pursuit (RPP). Planner: Smac Hybrid-A* (car-like).
# ============================================================================

# ----------------------------------------------------------------------------
# BT NAVIGATOR — el "director de orquesta": recibe el destino y coordina
# planner + controller + recoveries mediante un árbol de comportamiento (BT).
# ----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # arbol SIN recuperaciones que muevan el robot (no spin/backup): no se sale del mapa
    default_nav_to_pose_bt_xml: "/home/lab/robocar/src/robocar_pkg/config/nav2_bt_no_move.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

# ----------------------------------------------------------------------------
# PLANNER SERVER — traza la RUTA global (de dónde estás al destino) sobre el
# mapa. Smac Hybrid-A* genera rutas que un coche PUEDE seguir (respeta R_min).
# ----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25                 # m: si no llega exacto, acepta a esta distancia
      allow_unknown: false            # nuestro /map no tiene celdas "desconocidas"
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"   # solo hacia delante (sin marcha atrás, de momento)
      angle_quantization_bins: 72
      minimum_turning_radius: 0.93    # ¡EL RADIO REAL DEL COCHE!
      reverse_penalty: 2.0
      change_penalty: 0.15
      non_straight_penalty: 1.3
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: true

# ----------------------------------------------------------------------------
# CONTROLLER SERVER — CONDUCE: sigue la ruta soltando /cmd_vel, y comprueba
# si progresa y si ha llegado. Usa el local_costmap para obstáculos cercanos.
# ----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15      # ignoramos la orientación final (Ackermann no la borda)
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false   # ¡el coche NO puede girar en el sitio!
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_angular_accel: 3.2

# ----------------------------------------------------------------------------
# GLOBAL COSTMAP — el "mundo" para planificar: mapa estático (/map) + obstáculos
# del láser + un margen de seguridad inflado alrededor de las paredes.
# ----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: false
      robot_radius: 0.12            # el coche como un círculo de 18 cm (aprox.)
      rolling_window: false         # cubre todo el mapa
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true    # nuestro /map es latched
        subscribe_to_updates: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15       # margen de seguridad alrededor de obstáculos
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

# ----------------------------------------------------------------------------
# LOCAL COSTMAP — ventana pequeña que se mueve con el coche, solo para el
# controlador (obstáculos cercanos en vivo). No lleva el mapa estático.
# ----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.12
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          raytrace_max_range: 4.5
      range_layer:                              # 3 ultrasonidos (sensor_msgs/Range) para evitacion local
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/us_center", "/us_left", "/us_right"]
        input_sensor_type: "ALL"
        clear_on_max_reading: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

# ----------------------------------------------------------------------------
# BEHAVIOR SERVER — maniobras de recuperación si se atasca (esperar, retroceder).
# (Spin = girar en el sitio no lo puede hacer un Ackermann; queda por compat.)
# ----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

# ----------------------------------------------------------------------------
# LIFECYCLE MANAGER — arranca y activa todos los servidores en orden.
# (Sin map_server ni amcl: el mapa y map->odom los da el banco.)
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# COLLISION MONITOR — reflejo de seguridad: entre Nav2 y el robot. Si el IR ve
# algo dentro de la zona de parada, CORTA la velocidad (parada de emergencia),
# sin esperar a que Nav2 replanifique. cmd_vel_raw (Nav2) -> /cmd_vel (al coche).
# ----------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"
      points: [0.38, 0.16, 0.38, -0.16, 0.03, -0.16, 0.03, 0.16]   # caja delante del coche
      action_type: "stop"
      min_points: 1
      visualize: true
      polygon_pub_topic: "collision_stop_zone"
    observation_sources: ["ir"]
    ir:
      type: "range"
      topic: "/ir_range"

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - collision_monitor
